<script>
/* knocky.ru/<address> -> invitation page on the Knocky server */
(function(){var p=location.pathname.replace(/^\/+|\/+$/g,'').toLowerCase();
  if(/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/.test(p))location.replace('https://app.knocky.ru/i/'+p+location.search);})();
</script>
