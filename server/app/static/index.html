<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кабинет Knocky</title>
<meta name="robots" content="noindex">
<meta name="description" content="Личный кабинет Knocky: ваши приглашения, ответы гостей и ссылки.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/app.css?v=20261017c">
<script>try{const t=localStorage.getItem('knocky-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="logo" href="/" aria-label="Knocky, мои приглашения"><span>knocky</span><img class="logo-seal" src="/assets/favicon.svg" alt=""></a>
    <span class="tag">кабинет</span>
    <button class="tsw" id="themeBtn" type="button" role="switch" aria-checked="false" aria-label="Темная тема">
      <span class="tsw-k" aria-hidden="true">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.2M12 20.3v2.2M1.5 12h2.2M20.3 12h2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></g></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z" fill="currentColor"/></svg>
      </span>
    </button>
    <div class="who" id="who" hidden>
      <span id="whoMail"></span>
      <button class="lnk" id="logoutBtn" type="button">Выйти</button>
    </div>
  </div>
</header>
<main id="app" class="wrap" tabindex="-1" aria-live="polite"></main>
<footer class="foot wrap">
  <span>Knocky - приглашения на свадьбу по ссылке</span>
  <span><a href="mailto:hello@knocky.ru">hello@knocky.ru</a> · <a href="https://knocky.ru" target="_blank" rel="noopener">knocky.ru</a></span>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/assets/app.js?v=20261017c"></script>
</body>
</html>
