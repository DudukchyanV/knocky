<!--KH:start--><style id="kh-css">/* Knocky shared header: the same file on knocky.ru and app.knocky.ru (tools/inject_header.py) */
html{scrollbar-gutter:stable}
.kh{--kh-bg:#F7F4F4;--kh-ink:#241B20;--kh-muted:#6F6068;--kh-line:#E6D6D6;--kh-seal:#C62828;position:relative;z-index:40;background:var(--kh-bg);color:var(--kh-ink);font:500 16px/1.4 'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
:root[data-theme="dark"] .kh{--kh-bg:#141112;--kh-ink:#F3EEEE;--kh-muted:#A99BA1;--kh-line:#3A3233}
.kh *,.kh *::before,.kh *::after{box-sizing:border-box}
.kh-in{position:relative;display:flex;align-items:center;gap:24px;max-width:1160px;height:84px;margin:0 auto;padding:0 20px}
.kh-logo{display:flex;align-items:center;gap:8px;flex:none;color:var(--kh-ink);text-decoration:none;font:600 22px/1 'Unbounded','Arial Black',system-ui,sans-serif;letter-spacing:-.8px}
.kh-seal{width:28px;height:28px;flex:none;display:block}
.kh-tabs{display:flex;gap:2px;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--kh-ink) 8%,var(--kh-bg));flex:none}
.kh-tabs a{display:block;min-width:88px;padding:7px 14px;border-radius:999px;text-align:center;font:600 14px/20px 'Manrope',system-ui,sans-serif;letter-spacing:0;color:var(--kh-ink);text-decoration:none;white-space:nowrap}
.kh-tabs a[aria-current]{background:var(--kh-ink);color:var(--kh-bg)}
.kh-theme{margin-left:auto;position:relative;z-index:42;flex:none;width:52px;height:30px;padding:0;border:0;border-radius:999px;cursor:pointer;background:color-mix(in srgb,var(--kh-ink) 16%,var(--kh-bg));transition:background .25s}
:root[data-theme="dark"] .kh-theme{background:var(--kh-seal)}
.kh-knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;color:#241B20;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .25s cubic-bezier(.3,.7,.3,1)}
:root[data-theme="dark"] .kh-knob{transform:translateX(22px)}
.kh-knob svg{width:14px;height:14px;display:block}.kh-moon{display:none!important}
:root[data-theme="dark"] .kh-moon{display:block!important}:root[data-theme="dark"] .kh-sun{display:none!important}
.kh-mail{font-size:14px;line-height:20px;color:var(--kh-muted);max-width:26vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kh-mail[hidden]{display:none}
.kh-menu-btn{position:relative;z-index:42;flex:none;display:flex;align-items:center;gap:12px;padding:10px 0;border:0;background:none;color:var(--kh-ink);font:700 16px/20px 'Manrope',system-ui,sans-serif;cursor:pointer}
.kh-menu-btn span{min-width:4.4em;text-align:right}
.kh-menu-btn i{position:relative;width:22px;height:12px;display:block}
.kh-menu-btn i::before,.kh-menu-btn i::after{content:"";position:absolute;left:0;right:0;height:2px;background:currentColor;border-radius:2px;transition:transform .2s,top .2s}
.kh-menu-btn i::before{top:0}.kh-menu-btn i::after{top:10px}
.kh-menu-btn[aria-expanded="true"] i::before{top:5px;transform:rotate(45deg)}
.kh-menu-btn[aria-expanded="true"] i::after{top:5px;transform:rotate(-45deg)}
.kh-menu{position:fixed;top:0;right:0;z-index:41;width:min(460px,100vw);max-height:100vh;max-height:100dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:96px max(20px,calc((100vw - 1160px)/2 + 20px)) 200px 180px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 170px);mask-image:linear-gradient(90deg,transparent 0,#000 170px);
  background:linear-gradient(180deg,var(--kh-bg) 0,var(--kh-bg) calc(100% - 200px),color-mix(in srgb,var(--kh-bg) 70%,transparent) calc(100% - 120px),transparent 100%);background-attachment:local;
  display:flex;flex-direction:column;align-items:flex-end;text-align:right;
  transform:translateX(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),visibility 0s linear .35s}
.kh-menu.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.7,.2,1),visibility 0s}
.kh-msec{display:flex;flex-direction:column;align-items:flex-end;min-width:140px}
.kh-msec+.kh-msec{margin-top:14px;padding-top:14px;border-top:1px solid var(--kh-line)}
.kh-msec[hidden],.kh-row[hidden]{display:none}
.kh-row{display:block;padding:9px 0;border:0;background:none;color:var(--kh-ink);font:600 17px/1.3 'Manrope',system-ui,sans-serif;text-decoration:none;cursor:pointer}
.kh-row[aria-current]{color:var(--kh-seal)}
@media (hover:hover){.kh-tabs a:not([aria-current]):hover{background:color-mix(in srgb,var(--kh-ink) 10%,var(--kh-bg))}.kh-row:hover{color:var(--kh-seal)}}
@media (max-width:640px){.kh-mail{position:absolute;right:20px;top:64px;max-width:70vw;font-size:12px;line-height:16px}}
@media (max-width:600px){.kh-menu{width:100vw;padding:84px 20px 160px;-webkit-mask-image:none;mask-image:none}.kh-row{font-size:19px;padding:12px 0}.kh-msec{min-width:180px}}
@media (max-width:520px){.kh-in{gap:12px}.kh-logo span{display:none}.kh-menu-btn span{display:none}.kh-tabs a{min-width:76px;padding:7px 10px;font-size:13px}}
</style>

<script id="kh-js">/* Knocky shared header: the same file on knocky.ru and app.knocky.ru (tools/inject_header.py) */
(function(){
  var root=document.documentElement,$=function(i){return document.getElementById(i);};
  var page=/^app\./.test(location.hostname)||location.port==='8000'?'cab':'home',API=page==='cab'?'/api':'https://app.knocky.ru/api';
  /* on the main page the menu links scroll smoothly to the blocks (the page's own #anchor handler) */
  if(page==='home')document.querySelectorAll('.kh a[href^="https://knocky.ru/"]').forEach(function(a){var h=a.getAttribute('href').replace('https://knocky.ru/','');a.setAttribute('href',h||'#top');});
  document.querySelectorAll('.kh [data-k]').forEach(function(a){if(a.getAttribute('data-k')===page)a.setAttribute('aria-current','page');});
  /* theme: one setting for knocky.ru and app.knocky.ru (cookie on the whole domain) */
  function readTheme(){var c;try{c=(document.cookie.match(/(?:^|; )knocky-theme=(dark|light)/)||[])[1]||localStorage.getItem('knocky-theme');}catch(e){}return c==='dark'?'dark':'light';}
  function setTheme(t,save){root.setAttribute('data-theme',t);$('khTheme').setAttribute('aria-checked',t==='dark'?'true':'false');
    if(save)try{localStorage.setItem('knocky-theme',t);document.cookie='knocky-theme='+t+';path=/;max-age=31536000;samesite=lax'+(/knocky\.ru$/.test(location.hostname)?';domain=knocky.ru':'');}catch(e){}
    try{document.dispatchEvent(new CustomEvent('kh-theme',{detail:t}));}catch(e){}}
  setTheme(readTheme(),false);
  $('khTheme').addEventListener('click',function(){setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark',true);});
  addEventListener('pageshow',function(){var t=readTheme();if(t!==root.getAttribute('data-theme'))setTheme(t,false);});
  /* menu */
  var btn=$('khMenuBtn'),menu=$('khMenu');
  function isOpen(){return menu.classList.contains('open');}
  function setMenu(o){menu.classList.toggle('open',o);menu.setAttribute('aria-hidden',!o);btn.setAttribute('aria-expanded',o);}
  btn.addEventListener('click',function(e){e.stopPropagation();setMenu(!isOpen());});
  menu.addEventListener('click',function(e){if(e.target.closest('a,button'))setMenu(false);});
  document.addEventListener('click',function(e){if(isOpen()&&!e.target.closest('#khMenu'))setMenu(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&isOpen()){setMenu(false);btn.focus();}});
  /* who is signed in */
  function setUser(email){$('khMail').hidden=$('khOut').hidden=!email;$('khIn').hidden=!!email;$('khMail').textContent=email||'';
    try{document.dispatchEvent(new CustomEvent('kh-user',{detail:email||null}));}catch(e){}}
  function loadUser(){fetch(API+'/me',{credentials:'include'}).then(function(r){return r.json();}).then(function(j){setUser(j&&j.user?j.user.email:null);}).catch(function(){setUser(null);});}
  $('khOut').addEventListener('click',function(){fetch(API+'/auth/logout',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:'{}'}).catch(function(){}).then(function(){setUser(null);try{document.dispatchEvent(new CustomEvent('kh-logout'));}catch(e){}});});
  /* Yandex Metrika: only after "Принять все" in the cookie bar (one choice for knocky.ru and app.knocky.ru),
     never on guest invitations; no Webvisor (owner's choice) */
  var YM=114013158;
  function ckChoice(){var c;try{c=(document.cookie.match(/(?:^|; )knocky-cookies=(all|necessary)/)||[])[1]||localStorage.getItem('knocky-cookies');}catch(e){}return c||null;}
  function loadYm(){
    if(window.ym||ckChoice()!=='all'||/^#invite/.test(location.hash)||/^\/i\//.test(location.pathname))return;
    (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();
      k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a);})(window,document,'script','https://mc.yandex.ru/metrika/tag.js?id='+YM,'ym');
    ym(YM,'init',{clickmap:true,trackLinks:true,accurateTrackBounce:true,webvisor:false});
  }
  function setConsent(v){try{localStorage.setItem('knocky-cookies',v);document.cookie='knocky-cookies='+v+';path=/;max-age=31536000;samesite=lax'+(/knocky\.ru$/.test(location.hostname)?';domain=knocky.ru':'');}catch(e){}if(v==='all')loadYm();}
  function goal(n){try{if(window.ym)ym(YM,'reachGoal',n);}catch(e){}}
  function hit(url){try{if(window.ym)ym(YM,'hit',url||location.href);}catch(e){}}
  window.KH={setUser:setUser,reload:loadUser,page:page,consent:ckChoice,setConsent:setConsent,goal:goal,hit:hit};
  loadYm();
  loadUser();addEventListener('pageshow',function(e){if(e.persisted)loadUser();});
})();
</script><!--KH:end-->
